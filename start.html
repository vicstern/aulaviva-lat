<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">PRISMA™ Setup &amp; Quick Start — Aula Viva®</title>
  <meta name="description" content="How PRISMA™ runs 100% offline on macOS, Windows, Linux, and mobile devices—with zero cloud dependency and complete student data sovereignty.">
  <link rel="canonical" href="https://aulaviva.lat/start.html">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090d13'/><polygon points='50,18 82,78 18,78' fill='none' stroke='%2358a6ff' stroke-width='6'/><line x1='10' y1='56' x2='42' y2='48' stroke='%23ffffff' stroke-width='4'/><line x1='58' y1='46' x2='90' y2='36' stroke='%23c084fc' stroke-width='3.5'/><line x1='61' y1='52' x2='90' y2='52' stroke='%234ade80' stroke-width='3.5'/><line x1='64' y1='58' x2='90' y2='68' stroke='%23facc15' stroke-width='3.5'/></svg>">
  <script>
    (function() {
      var saved = null;
      try { saved = localStorage.getItem("av-theme"); } catch (e) {}
      var sysLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      if (saved === "light" || (!saved && sysLight)) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    :root {
      --bg: #090d13;
      --card-bg: #121820;
      --card-inner: #1a222d;
      --surface-deep: #0d1117;
      --pill-active-bg: #21262d;
      --pill-active-text: #ffffff;
      --pill-shadow: rgba(0, 0, 0, 0.5);
      --border: #262f3d;
      --accent: #2ea043;
      --accent-blue: #58a6ff;
      --text-main: #f0f6fc;
      --text-body: #c9d1d9;
      --text-muted: #8b949e;
      --text-dim: #5c6570;
      --delta-green: #3fb950;
      --sticky-bg: rgba(9, 13, 19, 0.94);
      --physio-curve: cubic-bezier(0.16, 1, 0.3, 1);
      --kheper-1: #c084fc;
      --kheper-2: #60a5fa;
      --kheper-3: #38bdf8;
      --kheper-4: #4ade80;
      --kheper-5: #facc15;
      --kheper-6: #fb923c;
      --kheper-7: #f87171;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --card-inner: #eef1f5;
      --surface-deep: #ffffff;
      --pill-active-bg: #ffffff;
      --pill-active-text: #1f2328;
      --pill-shadow: rgba(31, 35, 40, 0.12);
      --border: #d0d7de;
      --accent: #1a7f37;
      --accent-blue: #0969da;
      --text-main: #1f2328;
      --text-body: #32383f;
      --text-muted: #57606a;
      --text-dim: #6e7781;
      --delta-green: #1a7f37;
      --sticky-bg: rgba(255, 255, 255, 0.94);
      --kheper-1: #7e22ce;
      --kheper-2: #2563eb;
      --kheper-3: #0284c7;
      --kheper-4: #16a34a;
      --kheper-5: #d97706;
      --kheper-6: #ea580c;
      --kheper-7: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      overflow-x: clip;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 10px 24px 12px;
      position: relative;
      overflow-x: clip;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .top-bar-left {
      position: absolute;
      top: 10px;
      left: 22px;
      z-index: 20;
      display: flex;
      align-items: center;
    }
    .top-bar {
      position: absolute;
      top: 10px;
      right: 22px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-link, .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .pill-link:hover, .theme-toggle:hover { color: var(--text-main); border-color: var(--accent-blue); }
    .lang-switcher {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: 0 1px 3px var(--pill-shadow);
    }

    .brand-header {
      width: 100%;
      max-width: 1140px;
      text-align: center;
      padding: 2px 0 4px;
      flex-shrink: 0;
    }
    h1 {
      font-size: clamp(1.38rem, 2.05vw, 1.78rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      padding-top: 2px;
      margin: 0 0 2px;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    h1 span.reg {
      font-size: 0.72rem;
      vertical-align: super;
      font-weight: 400;
      color: var(--text-muted);
    }
    .kheper-svg { display: inline-block; flex-shrink: 0; }
    .kheper-hdr { height: 1.24em; width: auto; vertical-align: -0.14em; }
    .kheper-inline { height: 1.24em; width: auto; vertical-align: -0.20em; margin-right: 4px; }
    p.descriptor {
      font-size: clamp(0.82rem, 1.02vw, 0.9rem);
      color: var(--accent-blue);
      letter-spacing: 0.015em;
      margin-bottom: 0;
      line-height: 1.3;
      font-weight: 500;
    }

    .sticky-dock {
      position: sticky;
      top: 0;
      z-index: 30;
      width: calc(100% + 48px);
      margin: 0 -24px 12px;
      padding: 4px 24px 8px;
      background: var(--sticky-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s ease;
    }
    body.is-scrolled .sticky-dock {
      border-bottom-color: var(--border);
    }
    .quote-box {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      width: 100%;
      max-width: 1020px;
      text-align: center;
    }
    p.primary-quote {
      font-style: italic;
      font-size: clamp(0.84rem, 1.0vw, 0.92rem);
      line-height: 1.32;
      width: 100%;
      text-wrap: balance;
      background: linear-gradient(
        90deg,
        #FFFFFF 0%, #FFFFFF 28%, #E2E8F0 36%, #C084FC 48%, #60A5FA 58%,
        #38BDF8 68%, #4ADE80 78%, #FACC15 86%, #FB923C 93%, #F87171 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    html[data-theme="light"] p.primary-quote {
      background: linear-gradient(
        90deg,
        #1f2328 0%, #1f2328 28%, #334155 36%, #7e22ce 48%, #2563eb 58%,
        #0284c7 68%, #16a34a 78%, #b45309 86%, #ea580c 93%, #dc2626 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .tabs-dock {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      background: var(--card-bg);
      padding: 3px;
      border-radius: 22px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 17px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
    }
    .tab-btn svg { width: 19px; height: 19px; flex-shrink: 0; }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: 0 2px 6px var(--pill-shadow);
    }

    .content-stage {
      max-width: 1140px;
      width: 100%;
      flex: 1;
      padding-bottom: 18px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 30px;
      line-height: 1.65;
      text-align: left;
      animation: fadeIn 0.25s var(--physio-curve);
      margin-bottom: 14px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .panel h2 {
      font-size: 1.32rem;
      margin-bottom: 14px;
      color: var(--text-main);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .panel h3 {
      font-size: 1.04rem;
      margin: 22px 0 12px;
      color: var(--accent-blue);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .heading-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--accent-blue);
      flex-shrink: 0;
    }
    .heading-icon svg { width: 38px; height: 38px; }
    .panel h3 .heading-icon { width: 46px; height: 46px; border-radius: 11px; }
    .panel h3 .heading-icon svg { width: 28px; height: 28px; }
    .panel p {
      font-size: 0.94rem;
      color: var(--text-body);
      margin-bottom: 14px;
    }
    .beta-callout-banner {
      width: 100%;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 0 0 16px 0;
      text-align: center;
      font-size: 0.86rem;
      line-height: 1.48;
      color: var(--text-body);
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }
    .step-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(88, 166, 255, 0.16);
      color: var(--accent-blue);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .step-box strong {
      display: block;
      font-size: 0.94rem;
      color: var(--text-main);
      margin-bottom: 5px;
    }
    .step-box p {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 0;
      line-height: 1.5;
    }
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin: 12px 0 16px;
    }
    .tier-box {
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .tier-box strong {
      display: block;
      color: var(--text-main);
      margin-bottom: 4px;
      font-size: 0.92rem;
    }
    .tier-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(63, 185, 80, 0.14);
      color: var(--delta-green);
      margin-bottom: 6px;
    }
    .callout {
      background: var(--card-inner);
      border-left: 3px solid var(--accent-blue);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      font-size: 0.88rem;
      color: var(--text-body);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }
    .cta-row-top { margin: 4px 0 16px; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.14);
      color: #ffffff !important;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-disabled {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-deep);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: default;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-deep);
      border: 1px solid var(--border);
      color: var(--text-body) !important;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent-blue); color: var(--text-main) !important; }

    /* Plantilla copiable para PocketPal AI */
    .template-details {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 16px 0;
    }
    .template-details summary {
      list-style: none;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      user-select: none;
    }
    .template-details summary::-webkit-details-marker { display: none; }
    .template-details summary::after { content: "▾"; font-size: 0.9rem; transition: transform 0.2s; }
    .template-details[open] summary::after { transform: rotate(180deg); }
    .template-hint {
      font-size: 0.84rem !important;
      color: var(--text-muted) !important;
      margin: 10px 0 !important;
    }
    .template-pre {
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--text-body);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .panel-view { display: none; }
    .panel-view.active { display: block; }

    .panel a.inline-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
    .panel a.inline-link:hover { text-decoration: underline; }

    .qr-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(6, 9, 14, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .qr-modal-backdrop.open { display: flex; }
    .qr-modal-card {
      width: 100%;
      max-width: 345px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      text-align: center;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.2s var(--physio-curve);
    }
    .qr-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .qr-modal-title { font-size: 0.92rem; font-weight: 700; color: var(--text-main); }
    .qr-close-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .qr-close-btn:hover { color: var(--text-main); }
    .qr-frame {
      display: inline-flex;
      padding: 10px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 4px 0 10px;
    }
    .qr-frame svg { display: block; width: 184px; height: 184px; }
    .qr-url-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: var(--accent-blue);
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .qr-hint { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px; }
    .qr-actions { display: flex; flex-direction: column; gap: 8px; }
    .qr-actions button { width: 100%; justify-content: center; cursor: pointer; }

    footer {
      flex-shrink: 0;
      width: 100%;
      max-width: 1140px;
      padding: 10px 0 8px;
      font-size: 0.73rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.55;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    footer a { color: var(--accent-blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { padding: 12px 12px 18px; }
      .top-bar-left, .top-bar {
        position: static;
      }
      .mobile-top-row {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .sticky-dock {
        width: calc(100% + 24px);
        margin: 0 -12px 10px;
        padding: 6px 12px 8px;
      }
      .panel { padding: 18px 14px; border-radius: 12px; }
      .heading-icon { width: 48px; height: 48px; }
      .heading-icon svg { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>

  <div class="mobile-top-row">
    <div class="top-bar-left">
      <a class="pill-link" id="backLink" href="index.html#how">← Back to Aula Viva®</a>
    </div>
    <div class="top-bar">
      <button type="button" class="theme-toggle" id="btnShare" onclick="openQrModal()">↗ Share / QR</button>
      <button type="button" class="theme-toggle" id="btnTheme" onclick="toggleTheme()">☀ Light</button>
      <div class="lang-switcher">
        <button type="button" class="lang-btn active" id="btn-en" onclick="setLocale('en')">EN</button>
        <button type="button" class="lang-btn" id="btn-es" onclick="setLocale('es')">ES</button>
      </div>
    </div>

          <div class="tier-grid">

              <strong>PRISMA 4B · Recomendado para menos de 16 GB RAM</strong>
              PRISMA-Core · Qwen3.5-4B (~2.71 GB). Rápido, ligero y calibrado para laptops escolares estándar.

        `,
        mobile: `
          <div class="beta-callout-banner" id="bannerSlotMob"></div>

          <div class="steps-grid">
            <div class="step-box">

            <div class="step-box">
              <span class="step-num">3</span>
              ${IS_BETA_LIVE
                ? `<strong>Disponible hoy: PocketPal AI + PRISMA™ Visor</strong><p>Hoy ya puedes hacer el análisis de tu nota docente con PRISMA-Core 2B en tu teléfono usando PocketPal AI y pegar el resultado en PRISMA™ Visor (en el botón de <em>Ingresar JSON</em>) para obtener el mapa vectorial en ℝ⁸ y el semáforo de educabilidad —o correr la demo ahora mismo en modo avión con el caso interactivo de María.</p>`
                : `<strong>PRISMA™ Visor (disponible hoy) · PocketPal AI (próximamente)</strong><p>Análisis móvil directo con PRISMA-Core 2B (PocketPal AI): próximamente. Hoy ya puedes abrir PRISMA™ Visor en modo avión para explorar la demo interactiva de María o pegar cualquier salida JSON de PRISMA™.</p>`
              }
            </div>
          </div>
          <details class="template-details"${IS_BETA_LIVE ? " open" : ""}>
            <summary>📋 ${IS_BETA_LIVE ? "Plantilla de nota docente para PocketPal AI (PRISMA-Core 2B)" : "Vista previa: plantilla de nota docente para PocketPal AI (próximamente)"}</summary>
            <p class="template-hint">Como PocketPal AI funciona en un chat sin menús desplegables, esta plantilla breve ordena el estado de educabilidad y tu observación. Después la salida JSON se pega directo en PRISMA™ Visor (<em>Ingresar JSON</em>).</p>
            <pre class="template-pre" id="mobileTemplatePre"></pre>
            <button type="button" class="btn-secondary" id="btnCopyTemplate" onclick="copyMobileTemplate()">Copiar plantilla de nota</button>

          </div>
        `,
        inst: `
          <h2>${hIcon('building')}<span>Escuelas, redes educativas y Programa de Equidad</span></h2>
          <p style="margin-bottom:0;">¿Te interesa un programa piloto institucional, despliegue escolar 100 % aislado (Reportes Oficiales en Word / .docx por lote, cierre oficial de ciclo Tabula Rasa y trayectoria multi-ciclo en ℝ⁸) o nuestro Programa de Equidad Educativa para escuelas comunitarias? Escribe a <a class="inline-link" href="mailto:prisma@aulaviva.lat">prisma@aulaviva.lat</a></p>
        `,
        footer: `${kheperSvg("stFtrEs", "kheper-svg kheper-inline")}<strong>Aula Viva®</strong> por Víctor Stern Rodríguez &nbsp;·&nbsp; <a href="index.html#how">aulaviva.lat</a> &nbsp;·&nbsp; <a href="https://github.com/vicstern/PRISMA_App" target="_blank" rel="noopener noreferrer">GitHub</a> &nbsp;·&nbsp; <a href="mailto:victor@aulaviva.lat">victor@aulaviva.lat</a><br>ASPIRE® · PRISMA™ · SSRN: <a href="https://doi.org/10.2139/ssrn.7310080" target="_blank" rel="noopener noreferrer">10.2139/ssrn.7310080</a> · © 2026 Grupo SiEFH S.A.S.`
      }
    };

    const QR_COPY = {
      en: {
        btnShare: "↗ Share / QR",
        title: "Share / Download PRISMA™",
        hint: "Scan this QR code (works 100% offline) or share the direct setup & download link",
        nativeBtn: "Share via device (AirDrop · Messages)",
        copyBtn: "Copy link",
        copied: "✓ Link copied",
        shareText: "PRISMA™ by Aula Viva® — 100% offline local AI qualitative learning analytics in ℝ⁸"
      },
      es: {
        btnShare: "↗ Compartir / QR",
        title: "Compartir / Descargar PRISMA™",
        hint: "Escanea este código QR (100 % offline) o envía el enlace directo de descarga e instalación",
        nativeBtn: "Compartir (AirDrop · WhatsApp · Mensajes)",
        copyBtn: "Copiar enlace",
        copied: "✓ Enlace copiado",
        shareText: "PRISMA™ de Aula Viva® — Analítica cualitativa local 100 % offline en ℝ⁸"
      }
    };

    function updateThemeBtnLabel() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      document.getElementById("btnTheme").textContent = (currentLocale === "es")
        ? (isLight ? "☾ Oscuro" : "☀ Claro")
        : (isLight ? "☾ Dark" : "☀ Light");
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      if (htmlEl.getAttribute("data-theme") === "light") {
        htmlEl.removeAttribute("data-theme");
        try { localStorage.setItem("av-theme", "dark"); } catch (e) {}
      } else {
        htmlEl.setAttribute("data-theme", "light");
        try { localStorage.setItem("av-theme", "light"); } catch (e) {}
      }
      updateThemeBtnLabel();
    }

    function switchDevice(dev) {
      currentDevice = (dev === "mobile") ? "mobile" : "computer";
      document.getElementById("tabComputer").classList.toggle("active", currentDevice === "computer");
      document.getElementById("tabMobile").classList.toggle("active", currentDevice === "mobile");
      document.getElementById("viewComputer").classList.toggle("active", currentDevice === "computer");
      document.getElementById("viewMobile").classList.toggle("active", currentDevice === "mobile");
    }

    function setLocale(loc) {
      currentLocale = (loc === "es") ? "es" : "en";
      try { localStorage.setItem("av-lang", currentLocale); } catch (e) {}
      document.documentElement.lang = currentLocale;
      document.getElementById("btn-en").classList.toggle("active", currentLocale === "en");
      document.getElementById("btn-es").classList.toggle("active", currentLocale === "es");
      const c = COPY[currentLocale];
      document.getElementById("pageTitle").textContent = c.pageTitle;
      document.getElementById("backLink").textContent = c.backLink;
      document.getElementById("subTitle").textContent = c.subTitle;
      document.getElementById("primaryQuote").textContent = c.quote;
      document.getElementById("tabComputer").innerHTML = `${ICONS.laptop}<span>${c.tabComputer}</span>`;
      document.getElementById("tabMobile").innerHTML = `${ICONS.smartphone}<span>${c.tabMobile}</span>`;
      document.getElementById("tabVisor").innerHTML = `${ICONS.prism}<span>${c.tabVisor}</span>`;
      document.getElementById("computerCard").innerHTML = c.computer;
      document.getElementById("mobileCard").innerHTML = c.mobile;
      document.getElementById("instCard").innerHTML = c.inst;
      document.getElementById("siteFooter").innerHTML = c.footer;
      const bannerHtml = IS_BETA_LIVE ? c.bannerLive : c.bannerPreview;
      const b1 = document.getElementById("bannerSlotDesk");
      const b2 = document.getElementById("bannerSlotMob");
      if (b1) b1.innerHTML = bannerHtml;
      if (b2) b2.innerHTML = bannerHtml;
      const tpl = document.getElementById("mobileTemplatePre");
      if (tpl) tpl.textContent = MOBILE_TEMPLATES[currentLocale];
      updateQrLocale();
      updateThemeBtnLabel();
    }

    async function copyMobileTemplate() {
      const txt = MOBILE_TEMPLATES[currentLocale];
      const btn = document.getElementById("btnCopyTemplate");
      const c = COPY[currentLocale];
      try {
        await navigator.clipboard.writeText(txt);
      } catch (e) {
        const tmp = document.createElement("textarea");
        tmp.value = txt;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
      }
      if (btn) {
        btn.textContent = c.copiedTplBtn;
        setTimeout(() => { btn.textContent = c.copyTplBtn; }, 1800);
      }
    }

    function updateQrLocale() {
      const q = QR_COPY[currentLocale];
      document.getElementById("btnShare").textContent = q.btnShare;
      document.getElementById("qrModalTitle").textContent = q.title;
      document.getElementById("qrHint").textContent = q.hint;
      document.getElementById("btnQrNativeShare").textContent = q.nativeBtn;
      document.getElementById("btnQrCopyUrl").textContent = q.copyBtn;
    }

    function openQrModal() {
      updateQrLocale();
      const modal = document.getElementById("qrShareModal");
      const nBtn = document.getElementById("btnQrNativeShare");
      if (nBtn) nBtn.style.display = navigator.share ? "inline-flex" : "none";
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeQrModal() {
      const modal = document.getElementById("qrShareModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    async function triggerQrNativeShare() {
      if (!navigator.share) return;
      const q = QR_COPY[currentLocale];
      try {
        await navigator.share({ title: "PRISMA™ — Aula Viva®", text: q.shareText, url: QR_START_URL });
      } catch (e) {}
    }

    async function copyQrUrl() {
      const q = QR_COPY[currentLocale];
      const btn = document.getElementById("btnQrCopyUrl");
      try {
        await navigator.clipboard.writeText(QR_START_URL);
      } catch (e) {
        const tmp = document.createElement("textarea");
        tmp.value = QR_START_URL;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
      }
      btn.textContent = q.copied;
      setTimeout(() => { btn.textContent = q.copyBtn; }, 1800);
    }

    function applyHashDevice() {
      const h = (window.location.hash || "").toLowerCase().replace(/^#/, "");
      if (h === "mobile" || h === "celular") switchDevice("mobile");
      else if (h === "computer" || h === "computadora") switchDevice("computer");
    }

    window.addEventListener("scroll", function() {
      document.body.classList.toggle("is-scrolled", window.scrollY > 36);
    }, { passive: true });
    window.addEventListener("keydown", function(e) { if (e.key === "Escape") closeQrModal(); });
    window.addEventListener("hashchange", applyHashDevice);

    (function init() {
      var savedLang = null;
      try { savedLang = localStorage.getItem("av-lang"); } catch (e) {}
      setLocale(savedLang === "es" || savedLang === "en" ? savedLang : "en");
      applyHashDevice();
    })();
  </script>
