<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">PRISMA™ Setup &amp; Quick Start — Aula Viva®</title>
  <meta name="description" content="How PRISMA™ runs 100% offline on macOS, Windows, Linux, and mobile devices—with zero cloud dependency and complete student data sovereignty.">
  <link rel="canonical" href="https://aulaviva.lat/start.html">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090d13'/><polygon points='50,18 82,78 18,78' fill='none' stroke='%2358a6ff' stroke-width='6'/><line x1='10' y1='56' x2='42' y2='48' stroke='%23ffffff' stroke-width='4'/><line x1='58' y1='46' x2='90' y2='36' stroke='%23c084fc' stroke-width='3.5'/><line x1='61' y1='52' x2='90' y2='52' stroke='%234ade80' stroke-width='3.5'/><line x1='64' y1='58' x2='90' y2='68' stroke='%23facc15' stroke-width='3.5'/></svg>">
  <script>
    (function() {
      var saved = null;
      try { saved = localStorage.getItem("av-theme"); } catch (e) {}
      var sysLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      if (saved === "light" || (!saved && sysLight)) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    :root {
      --bg: #090d13;
      --card-bg: #121820;
      --card-inner: #1a222d;
      --surface-deep: #0d1117;
      --pill-active-bg: #21262d;
      --pill-active-text: #ffffff;
      --pill-shadow: rgba(0, 0, 0, 0.5);
      --border: #262f3d;
      --accent: #2ea043;
      --accent-blue: #58a6ff;
      --text-main: #f0f6fc;
      --text-body: #c9d1d9;
      --text-muted: #8b949e;
      --text-dim: #5c6570;
      --delta-green: #3fb950;
      --kheper-1: #c084fc;
      --kheper-2: #60a5fa;
      --kheper-3: #38bdf8;
      --kheper-4: #4ade80;
      --kheper-5: #facc15;
      --kheper-6: #fb923c;
      --kheper-7: #f87171;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --card-inner: #eef1f5;
      --surface-deep: #ffffff;
      --pill-active-bg: #ffffff;
      --pill-active-text: #1f2328;
      --pill-shadow: rgba(31, 35, 40, 0.12);
      --border: #d0d7de;
      --accent: #1a7f37;
      --accent-blue: #0969da;
      --text-main: #1f2328;
      --text-body: #32383f;
      --text-muted: #57606a;
      --text-dim: #6e7781;
      --delta-green: #1a7f37;
      --kheper-1: #7e22ce;
      --kheper-2: #2563eb;
      --kheper-3: #0284c7;
      --kheper-4: #16a34a;
      --kheper-5: #d97706;
      --kheper-6: #ea580c;
      --kheper-7: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 18px 24px;
    }
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-link, .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pill-link:hover, .theme-toggle:hover { color: var(--text-main); border-color: var(--accent-blue); }
    .lang-switcher {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: 0 1px 3px var(--pill-shadow);
    }

    header {
      width: 100%;
      max-width: 820px;
      text-align: center;
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(1.42rem, 2.3vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 4px;
    }
    h1 span.reg {
      font-size: 0.74rem;
      vertical-align: super;
      font-weight: 400;
      color: var(--text-muted);
    }
    .kheper-svg { display: inline-block; flex-shrink: 0; vertical-align: middle; }
    .kheper-hdr { width: 1.1em; height: 1.1em; }
    .kheper-inline { width: 15px; height: 15px; }
    .subtitle {
      font-size: 0.94rem;
      color: var(--accent-blue);
      font-weight: 500;
      margin-bottom: 14px;
    }
    .status-banner {
      max-width: 780px;
      margin: 0 auto;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.30);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-body);
      text-align: center;
    }

    .device-tabs {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 4px;
      gap: 6px;
      margin: 18px 0 18px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .device-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 18px;
      border-radius: 19px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .device-tab:hover { color: var(--text-main); }
    .device-tab.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: 0 2px 6px var(--pill-shadow);
    }

    main {
      width: 100%;
      max-width: 900px;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 26px;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    .card h3 {
      font-size: 0.98rem;
      color: var(--accent-blue);
      margin: 18px 0 8px;
    }
    .card p {
      font-size: 0.92rem;
      color: var(--text-body);
      margin-bottom: 12px;
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }
    .step-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 15px 16px;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(88, 166, 255, 0.16);
      color: var(--accent-blue);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .step-box strong {
      display: block;
      font-size: 0.92rem;
      color: var(--text-main);
      margin-bottom: 5px;
    }
    .step-box p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 0;
      line-height: 1.48;
    }

    .tier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin: 12px 0 16px;
    }
    .tier-box {
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.86rem;
      color: var(--text-body);
    }
    .tier-box strong {
      display: block;
      color: var(--text-main);
      margin-bottom: 4px;
      font-size: 0.92rem;
    }
    .tier-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(63, 185, 80, 0.14);
      color: var(--delta-green);
      margin-bottom: 6px;
    }

    .callout {
      background: var(--card-inner);
      border-left: 3px solid var(--accent-blue);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 14px 0;
      font-size: 0.87rem;
      color: var(--text-body);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.14);
      color: #ffffff !important;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-disabled {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-inner);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: default;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-deep);
      border: 1px solid var(--border);
      color: var(--text-body) !important;
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent-blue); color: var(--text-main) !important; }

    .panel-view { display: none; }
    .panel-view.active { display: block; }

    .inst-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 18px;
    }
    .inst-card h3 {
      font-size: 1.02rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .inst-card p {
      font-size: 0.88rem;
      color: var(--text-body);
      line-height: 1.55;
      margin-bottom: 0;
    }
    .inst-card a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
    .inst-card a:hover { text-decoration: underline; }

    .qr-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(6, 9, 14, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .qr-modal-backdrop.open { display: flex; }
    .qr-modal-card {
      width: 100%;
      max-width: 345px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      text-align: center;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    }
    .qr-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .qr-modal-title { font-size: 0.92rem; font-weight: 700; color: var(--text-main); }
    .qr-close-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .qr-close-btn:hover { color: var(--text-main); }
    .qr-frame {
      display: inline-flex;
      padding: 10px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 4px 0 10px;
    }
    .qr-frame svg { display: block; width: 184px; height: 184px; }
    .qr-url-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: var(--accent-blue);
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .qr-hint { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px; }
    .qr-actions { display: flex; flex-direction: column; gap: 8px; }
    .qr-actions button { width: 100%; justify-content: center; cursor: pointer; }
    .cta-row-top { margin: 4px 0 16px; }

    footer {
      width: 100%;
      max-width: 900px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    footer a { color: var(--accent-blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .footer-brand-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    @media (max-width: 640px) {
      .card { padding: 18px 15px; }
      .inst-card { padding: 16px 15px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a class="pill-link" id="backLink" href="index.html">← Back to Aula Viva®</a>
    <div class="top-right">
      <button type="button" class="theme-toggle" id="btnShare" onclick="openQrModal()">↗ Share / QR</button>
      <button type="button" class="theme-toggle" id="btnTheme" onclick="toggleTheme()">☀ Light</button>
      <div class="lang-switcher">

        <button type="button" class="lang-btn" id="btn-es" onclick="setLocale('es')">ES</button>
      </div>
    </div>
  </div>

  <header>

stroke-linecap="round" stroke-linejoin="round"/><path d="M51.8 17.2 L55.0 16.0 M51.2 13.4 L54.0 11.4" stroke="url(#kheperGrad_startHdr)" stroke-width="2.1" stroke-linecap="round"/><path d="M18.6 34.8 C12.4 34.4 8.2 37.2 7.6 42.2 C7.3 44.6 8.4 46.8 10.6 48.2" stroke="url(#kheperGrad_startHdr)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.4 34.8 C51.6 34.4 55.8 37.2 56.4 42.2 C56.7 44.6 55.6 46.8 53.4 48.2" stroke="url(#kheperGrad_startHdr)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.0 46.2 C15.2 48.8 12.8 53.4 15.2 57.6 C16.8 60.0 19.8 60.6 23.0 59.6" stroke="url(#kheperGrad_startHdr)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M43.0 46.2 C48.8 48.8 51.2 53.4 48.8 57.6 C47.2 60.0 44.2 60.6 41.0 59.6" stroke="url(#kheperGrad_startHdr)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>PRISMA™ · Aula Viva<span class="reg">®</span></span></h1>
    <p class="subtitle" id="subTitle">How PRISMA™ runs 100% offline on your device</p>
    <div class="status-banner" id="statusBanner"></div>

    <div class="device-tabs" role="tablist">
      <button type="button" class="device-tab active" id="tabComputer" onclick="switchDevice('computer')">Computer (Mac · Windows · Linux)</button>
      <button type="button" class="device-tab" id="tabMobile" onclick="switchDevice('mobile')">Mobile (iOS · Android)</button>
      <a class="device-tab" id="tabVisor" href="visor.html">PRISMA™ Visor</a>
    </div>
  </header>

  <main>
    <section id="viewComputer" class="panel-view active">
      <div class="card" id="computerCard"></div>
    </section>

    <section id="viewMobile" class="panel-view">
      <div class="card" id="mobileCard"></div>
    </section>

    <section class="inst-card" id="instCard"></section>
  </main>

  <div id="qrShareModal" class="qr-modal-backdrop" aria-hidden="true" onclick="if(event.target===this) closeQrModal()">
    <div class="qr-modal-card" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
      <div class="qr-modal-head">
        <span id="qrModalTitle" class="qr-modal-title">Share / Download PRISMA™</span>

          <p>¿Te interesa un programa piloto institucional, despliegue escolar 100 % aislado (reportes <code>.docx</code> por lote, cierre oficial de ciclo Tabula Rasa y trayectoria multi-ciclo en ℝ⁸) o nuestro Programa de Equidad Educativa para escuelas comunitarias? Escribe a <a href="mailto:prisma@aulaviva.lat">prisma@aulaviva.lat</a></p>
        `,
        footer: `<span class="footer-brand-line">${kheperSvg("stFtrEs", "kheper-svg kheper-inline")}<strong>Aula Viva®</strong> · PRISMA™ · <a href="https://aulaviva.lat">aulaviva.lat</a></span><br>ASPIRE® · SSRN: <a href="https://doi.org/10.2139/ssrn.7310080" target="_blank" rel="noopener noreferrer">10.2139/ssrn.7310080</a> · © 2026 Grupo SiEFH S.A.S.`
      }
    };

    function updateThemeBtnLabel() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      document.getElementById("btnTheme").textContent = (currentLocale === "es")
        ? (isLight ? "☾ Oscuro" : "☀ Claro")
        : (isLight ? "☾ Dark" : "☀ Light");
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      if (htmlEl.getAttribute("data-theme") === "light") {
        htmlEl.removeAttribute("data-theme");
        try { localStorage.setItem("av-theme", "dark"); } catch (e) {}
      } else {
        htmlEl.setAttribute("data-theme", "light");
        try { localStorage.setItem("av-theme", "light"); } catch (e) {}
      }
      updateThemeBtnLabel();
    }

    function switchDevice(dev) {
      currentDevice = dev;
      document.getElementById("tabComputer").classList.toggle("active", dev === "computer");
      document.getElementById("tabMobile").classList.toggle("active", dev === "mobile");
      document.getElementById("viewComputer").classList.toggle("active", dev === "computer");
      document.getElementById("viewMobile").classList.toggle("active", dev === "mobile");
    }

    function setLocale(loc) {
      currentLocale = (loc === "es") ? "es" : "en";
      try { localStorage.setItem("av-lang", currentLocale); } catch (e) {}
      document.documentElement.lang = currentLocale;
      if (typeof updateQrLocale === "function") updateQrLocale();
      document.getElementById("btn-en").classList.toggle("active", loc === "en");
      document.getElementById("btn-es").classList.toggle("active", loc === "es");
      const c = COPY[loc];
      document.getElementById("pageTitle").textContent = c.pageTitle;
      document.getElementById("backLink").textContent = c.backLink;
      document.getElementById("subTitle").textContent = c.subTitle;
      document.getElementById("statusBanner").innerHTML = IS_BETA_LIVE ? c.bannerLive : c.bannerPreview;
      document.getElementById("tabComputer").textContent = c.tabComputer;
      document.getElementById("tabMobile").textContent = c.tabMobile;
      document.getElementById("tabVisor").textContent = c.tabVisor;
      document.getElementById("computerCard").innerHTML = c.computer;
      document.getElementById("mobileCard").innerHTML = c.mobile;
      document.getElementById("instCard").innerHTML = c.inst;
      document.getElementById("siteFooter").innerHTML = c.footer;
      updateThemeBtnLabel();
    }

    const QR_START_URL = "https://aulaviva.lat/start.html";
    const QR_COPY = {
      en: {
        btnShare: "↗ Share / QR",
        title: "Share / Download PRISMA™",
        hint: "Scan this QR code (works 100% offline) or share the direct setup & download link",
        nativeBtn: "Share via device (AirDrop · Messages)",
        copyBtn: "Copy link",
        copied: "✓ Link copied",
        shareText: "PRISMA™ by Aula Viva® — 100% offline local AI qualitative learning analytics in ℝ⁸"
      },
      es: {
        btnShare: "↗ Compartir / QR",
        title: "Compartir / Descargar PRISMA™",
        hint: "Escanea este código QR (100 % offline) o envía el enlace directo de descarga e instalación",
        nativeBtn: "Compartir (AirDrop · WhatsApp · Mensajes)",
        copyBtn: "Copiar enlace",
        copied: "✓ Enlace copiado",
        shareText: "PRISMA™ de Aula Viva® — Analítica cualitativa local 100 % offline en ℝ⁸"
      }
    };

    function updateQrLocale() {
      const q = QR_COPY[currentLocale === "es" ? "es" : "en"];
      const bs = document.getElementById("btnShare");
      if (bs) bs.textContent = q.btnShare;
      const mt = document.getElementById("qrModalTitle");
      if (mt) mt.textContent = q.title;
      const mh = document.getElementById("qrHint");
      if (mh) mh.textContent = q.hint;
      const bn = document.getElementById("btnQrNativeShare");
      if (bn) bn.textContent = q.nativeBtn;
      const bc = document.getElementById("btnQrCopyUrl");
      if (bc) bc.textContent = q.copyBtn;
    }

    function openQrModal() {
      updateQrLocale();
      const modal = document.getElementById("qrShareModal");
      const nBtn = document.getElementById("btnQrNativeShare");
      if (nBtn) nBtn.style.display = navigator.share ? "inline-flex" : "none";
      if (modal) {
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      }
    }

    function closeQrModal() {
      const modal = document.getElementById("qrShareModal");
      if (modal) {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      }
    }

    async function triggerQrNativeShare() {
      if (!navigator.share) return;
      const q = QR_COPY[currentLocale === "es" ? "es" : "en"];
      try {
        await navigator.share({ title: "PRISMA™ — Aula Viva®", text: q.shareText, url: QR_START_URL });
      } catch (e) {}
    }

    async function copyQrUrl() {
      const q = QR_COPY[currentLocale === "es" ? "es" : "en"];
      const btn = document.getElementById("btnQrCopyUrl");
      try {
        await navigator.clipboard.writeText(QR_START_URL);
      } catch (e) {
        const tmp = document.createElement("textarea");
        tmp.value = QR_START_URL;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
      }
      if (btn) {
        btn.textContent = q.copied;
        setTimeout(() => { btn.textContent = q.copyBtn; }, 1800);
      }
    }

    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeQrModal();
    });

    (function initSavedLocale() {
      var savedLang = null;
      try { savedLang = localStorage.getItem("av-lang"); } catch (e) {}
      setLocale(savedLang === "es" || savedLang === "en" ? savedLang : "en");
    })();
  </script>
</body>
</html>
