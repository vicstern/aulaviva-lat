<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title id="pageTitle">Aula Viva® — PRISMA™ Visor (ℝ⁸)</title>
  <meta name="description" content="PRISMA™ — Visor móvil 100 % offline para proyectar notas cualitativas en el espacio vectorial ℝ⁸.">
  <meta name="theme-color" content="#090d13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRISMA Visor">
  <link rel="manifest" href="visor-manifest.json">
  <link rel="apple-touch-icon" href="visor-icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090d13'/><polygon points='50,18 82,78 18,78' fill='none' stroke='%2358a6ff' stroke-width='6'/><line x1='10' y1='56' x2='42' y2='48' stroke='%23ffffff' stroke-width='4'/><line x1='58' y1='46' x2='90' y2='36' stroke='%23c084fc' stroke-width='3.5'/><line x1='61' y1='52' x2='90' y2='52' stroke='%234ade80' stroke-width='3.5'/><line x1='64' y1='58' x2='90' y2='68' stroke='%23facc15' stroke-width='3.5'/></svg>">
  <script>
    (function() {
      var saved = null;
      try { saved = localStorage.getItem("av-theme"); } catch (e) {}
      var sysLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      if (saved === "light" || (!saved && sysLight)) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    :root {
      --bg: #090d13;
      --card-bg: #121820;
      --card-inner: #1a222d;
      --surface-deep: #0d1117;
      --pill-active-bg: #21262d;
      --pill-active-text: #ffffff;
      --pill-shadow: rgba(0, 0, 0, 0.5);
      --border: #262f3d;
      --accent: #2ea043;
      --accent-blue: #58a6ff;
      --text-main: #f0f6fc;
      --text-body: #c9d1d9;
      --text-muted: #8b949e;
      --text-dim: #5c6570;
      --delta-green: #3fb950;
      --delta-yellow: #e3b341;
      --delta-red: #f85149;
      --radar-grid: #262f3d;
      --physio-curve: cubic-bezier(0.16, 1, 0.3, 1);
      --kheper-1: #c084fc;
      --kheper-2: #60a5fa;
      --kheper-3: #38bdf8;
      --kheper-4: #4ade80;
      --kheper-5: #facc15;
      --kheper-6: #fb923c;
      --kheper-7: #f87171;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --card-inner: #eef1f5;
      --surface-deep: #ffffff;
      --pill-active-bg: #ffffff;
      --pill-active-text: #1f2328;
      --pill-shadow: rgba(31, 35, 40, 0.12);
      --border: #d0d7de;
      --accent: #1a7f37;
      --accent-blue: #0969da;
      --text-main: #1f2328;
      --text-body: #32383f;
      --text-muted: #57606a;
      --text-dim: #6e7781;
      --delta-green: #1a7f37;
      --delta-yellow: #b45309;
      --delta-red: #cf222e;
      --radar-grid: #d0d7de;
      --kheper-1: #7e22ce;
      --kheper-2: #2563eb;
      --kheper-3: #0284c7;
      --kheper-4: #16a34a;
      --kheper-5: #d97706;
      --kheper-6: #ea580c;
      --kheper-7: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      position: relative;
    }

    .top-bar {
      width: 100%;
      max-width: 920px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-toggle:hover { color: var(--text-main); }
    .lang-switcher {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: 0 1px 3px var(--pill-shadow);
    }

    .header-zone {
      text-align: center;
      width: 100%;
      max-width: 820px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(1.38rem, 2.2vw, 1.78rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .kheper-svg { display: inline-block; flex-shrink: 0; vertical-align: middle; }
    .kheper-hdr { width: 1.08em; height: 1.08em; }
    .kheper-inline { width: 15px; height: 15px; margin-right: 4px; }
    .footer-brand-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .panel-card.collapsed-input {
      padding: 11px 16px;
      margin-bottom: 12px;
    }
    .panel-card.collapsed-input .card-title-row {
      margin-bottom: 0;
    }
    .panel-card.collapsed-input #lblPaste,
    .panel-card.collapsed-input #inputBodyWrap {
      display: none;
    }
    .btn-edit-json {
      display: none;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-body);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-edit-json:hover { color: var(--text-main); border-color: var(--accent-blue); }
    .panel-card.collapsed-input .btn-edit-json {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .share-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(6, 9, 14, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .share-modal-backdrop.open { display: flex; }
    .share-modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      text-align: center;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.2s var(--physio-curve);
    }
    .share-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .share-modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .share-close-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .share-close-btn:hover { color: var(--text-main); }
    .qr-frame {
      display: inline-flex;
      padding: 10px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 4px 0 10px;
    }
    .qr-frame svg {
      display: block;
      width: 184px;
      height: 184px;
    }
    .share-url-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: var(--accent-blue);
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .share-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .share-actions button { width: 100%; }
    h1 span.reg {
      font-size: 0.72rem;
      vertical-align: super;
      font-weight: 400;
      color: var(--text-muted);
    }
    p.descriptor {
      font-size: clamp(0.82rem, 1.05vw, 0.9rem);
      color: var(--accent-blue);
      letter-spacing: 0.015em;
      line-height: 1.35;
      font-weight: 500;
      margin-bottom: 8px;
    }
    p.primary-quote {
      font-style: italic;
      font-size: clamp(0.84rem, 1.02vw, 0.92rem);
      line-height: 1.38;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
      background: linear-gradient(
        90deg,
        #FFFFFF 0%, #FFFFFF 28%, #E2E8F0 36%, #C084FC 48%, #60A5FA 58%,
        #38BDF8 68%, #4ADE80 78%, #FACC15 86%, #FB923C 93%, #F87171 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    html[data-theme="light"] p.primary-quote {
      background: linear-gradient(
        90deg,
        #1f2328 0%, #1f2328 28%, #334155 36%, #7e22ce 48%, #2563eb 58%,
        #0284c7 68%, #16a34a 78%, #b45309 86%, #ea580c 93%, #dc2626 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    main {
      width: 100%;
      max-width: 920px;
      flex: 1;
    }
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 16px;
      animation: fadeIn 0.25s var(--physio-curve);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-title-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .offline-pill {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--delta-green);
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.28);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    textarea {
      width: 100%;
      min-height: 126px;
      background: var(--surface-deep);
      color: var(--text-body);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      resize: vertical;
      margin-bottom: 12px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent-blue); }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-action {
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.12);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #2ea043; }
    .btn-secondary {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-body);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { color: var(--text-main); border-color: var(--accent-blue); }

    .err-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--delta-red);
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid rgba(248, 81, 73, 0.3);
    }

    .semaforo-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--delta-green);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .semaforo-title {
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .semaforo-box p {
      font-size: 0.88rem;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .semaforo-box p:last-child { margin-bottom: 0; }

    .viz-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    @media (min-width: 860px) {
      .viz-grid {
        display: grid;
        grid-template-columns: minmax(340px, 0.92fr) minmax(0, 1.08fr);
        gap: 20px;
        align-items: start;
      }
    }
    .radar-svg-box {
      width: 100%;
      background: var(--surface-deep);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .radar-svg-box svg {
      width: 100%;
      max-width: 440px;
      height: auto;
      display: block;
    }

    .delta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      table-layout: fixed;
    }
    .delta-table th, .delta-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .delta-table th {
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .delta-table .col-axis { width: 42%; }
    .delta-table .col-reason { width: 58%; }
    .axis-name {
      display: block;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.3;
    }
    .delta-val {
      display: block;
      margin-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .delta-pos { color: var(--delta-green); }
    .delta-neg { color: var(--delta-red); }
    .delta-neu { color: var(--text-dim); }
    .reason-txt {
      color: var(--text-muted);
      font-size: 0.83rem;
      line-height: 1.45;
    }

    footer {
      width: 100%;
      max-width: 920px;
      margin-top: auto;
      padding: 12px 0 4px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    footer a { color: var(--accent-blue); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .scarab-rainbow {
      font-family: "Noto Sans Egyptian Hieroglyphs", "Apple Symbols", sans-serif;
      font-size: 0.92rem;
      line-height: 1;
      background: linear-gradient(90deg, #c084fc, #38bdf8, #4ade80, #facc15, #fb923c, #f87171);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
      vertical-align: baseline;
      margin-right: 4px;
    }
    html[data-theme="light"] .scarab-rainbow {
      background: linear-gradient(90deg, #7e22ce, #0284c7, #16a34a, #d97706, #dc2626);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    @media (max-width: 640px) {
      .panel-card { padding: 16px 14px; border-radius: 12px; }
      .delta-table .col-axis { width: 44%; }
      .delta-table .col-reason { width: 56%; }
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #1f2328; padding: 0; }
      .panel-card, .radar-svg-box, .semaforo-box { border-color: #d0d7de; background: #fff; }
      p.primary-quote { -webkit-text-fill-color: #1f2328; color: #1f2328; background: none; }
    }
  </style>
</head>
<body>

  <div class="top-bar no-print">
    <button type="button" class="theme-toggle" id="btnShare" onclick="openShareModal()">↗ Compartir</button>
    <button type="button" class="theme-toggle" id="btnTheme" onclick="toggleTheme()">☀ Claro</button>
    <div class="lang-switcher">
      <button type="button" class="lang-btn" id="btn-en" onclick="setLocale('en')">EN</button>
      <button type="button" class="lang-btn active" id="btn-es" onclick="setLocale('es')">ES</button>
    </div>
  </div>

          Agencia_Intercultural: { razonamiento: "Liderazgo inclusivo en la asignación de roles dentro del grupo, demostrando capacidad de gestión de la dinámica colectiva.", polaridad: "CRECIMIENTO", delta_basal_pct: 15, delta_pct: 15 },
          Liderazgo_Colaborativo: { razonamiento: "Coordinación del equipo para la presentación, recuperación de la atención tras la distracción y gestión de la dinámica grupal.", polaridad: "CRECIMIENTO", delta_basal_pct: 25, delta_pct: 25 },
          Saber_Hacer_Ejecucion_Tecnica: { razonamiento: "Construcción del prototipo, detección de fallo técnico (flujo lento), ajuste empírico de materiales (arena) y optimización del proceso.", polaridad: "CRECIMIENTO", delta_basal_pct: 30, delta_pct: 30 },

        }
      },
      en: {

          advertencia_pedagogica: "Prioritize somatic care and rest. Frame emotional outbursts (yelling, throwing items) as temporary dysregulation due to acute pain/fatigue, and acknowledge her self-initiated repair as an act of courage under duress."
        },
        evaluacion_ejes: {

          Razonamiento_Etico: { razonamiento: "High merit: Spontaneous apology to classmates and teacher on her own initiative despite acute pain and frustration, demonstrating moral agency and repair of harm ⚡ [Amplified from +1.6 dB (+20%) · 🔴].", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 32 },
          Agencia_Intercultural: { razonamiento: "Demonstrated inclusive leadership by re-engaging distracted peers and assigning tasks for collective success, validating group effort.", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 20 },
          Liderazgo_Colaborativo: { razonamiento: "Demonstrated non-coercive coordination by calling the team together and assigning tasks. Emotional withdrawal (silence) was a reaction to frustration, not sabotage.", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 20 },
          Saber_Hacer_Ejecucion_Tecnica: { razonamiento: "Observable hands-on craftsmanship: examined materials, adjusted layer thickness, and ensured functional output of the water filter prototype.", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 20 },
          Resiliencia_Autogestion: { razonamiento: "High merit: Persisted through acute pain and frustration to complete the task and apologize, overcoming severe somatic strain to restore equilibrium ⚡ [Amplified from +1.6 dB (+20%) · 🔴].", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 32 },
          Reflexion_Metacognitiva: { razonamiento: "Demonstrated intellectual humility and self-awareness by recognizing her emotional state, apologizing, and repairing relationships despite the initial outburst ⚡ [Amplified from +1.6 dB (+20%) · 🔴].", polaridad: "GROWTH", delta_basal_pct: 20, delta_pct: 32 }
        }
      }
    };

    let swReady = false;

    function updateThemeBtnLabel() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      const label = (currentLocale === "es")
        ? (isLight ? "☾ Oscuro" : "☀ Claro")
        : (isLight ? "☾ Dark" : "☀ Light");
      document.getElementById("btnTheme").textContent = label;
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const isLight = htmlEl.getAttribute("data-theme") === "light";
      if (isLight) {
        htmlEl.removeAttribute("data-theme");
        try { localStorage.setItem("av-theme", "dark"); } catch (e) {}
      } else {
        htmlEl.setAttribute("data-theme", "light");
        try { localStorage.setItem("av-theme", "light"); } catch (e) {}
      }
      updateThemeBtnLabel();
    }

    function setLocale(loc) {
      currentLocale = loc;
      document.documentElement.lang = loc;
      document.getElementById("btn-en").classList.toggle("active", loc === "en");
      document.getElementById("btn-es").classList.toggle("active", loc === "es");
      const t = UI[loc];
      document.getElementById("pageTitle").textContent = t.pageTitle;
      document.getElementById("appDescriptor").textContent = t.descriptor;
      document.getElementById("primaryQuote").textContent = t.quote;
      document.getElementById("lblPaste").textContent = t.lblPaste;
      document.getElementById("offlinePill").textContent = swReady ? t.offlineCached : t.offlinePill;
      document.getElementById("btnRender").textContent = t.btnRender;
      document.getElementById("btnPaste").textContent = t.btnPaste;
      document.getElementById("btnSample").textContent = t.btnSample;
      document.getElementById("btnClear").textContent = t.btnClear;
      document.getElementById("thAxis").textContent = t.thAxis;
      document.getElementById("thReason").textContent = t.thReason;
      document.getElementById("btnPrint").textContent = t.btnPrint;
      document.getElementById("siteFooter").innerHTML = t.footer;
      document.getElementById("btnShare").textContent = t.btnShare;
      document.getElementById("btnEditJson").textContent = t.btnEditJson;
      document.getElementById("shareModalTitle").textContent = t.shareTitle;
      document.getElementById("shareHint").textContent = t.shareHint;
      document.getElementById("btnNativeShare").textContent = t.btnNativeShare;
      document.getElementById("btnCopyUrl").textContent = t.btnCopyUrl;
      updateThemeBtnLabel();

      if (isSampleLoaded) {
        lastParsed = SAMPLES[loc];
        document.getElementById("jsonInput").value = JSON.stringify(lastParsed, null, 2);
        renderData(lastParsed);
      } else if (lastParsed) {
        renderData(lastParsed);
      }
    }

    document.getElementById("jsonInput").addEventListener("input", () => {
      isSampleLoaded = false;
    });

    async function pasteClipboard() {
      try {
        const txt = await navigator.clipboard.readText();
        isSampleLoaded = false;
        document.getElementById("jsonInput").value = txt;
        renderFromInput();
      } catch (e) {
        const box = document.getElementById("jsonInput");
        box.focus();
      }
    }

    function loadSample() {
      isSampleLoaded = true;
      lastParsed = SAMPLES[currentLocale];
      document.getElementById("jsonInput").value = JSON.stringify(lastParsed, null, 2);
      document.getElementById("errBox").style.display = "none";
      renderData(lastParsed);
    }

    function clearAll() {
      isSampleLoaded = false;
      lastParsed = null;
      document.getElementById("jsonInput").value = "";
      document.getElementById("resultSection").style.display = "none";
      expandInputCard();
      document.getElementById("errBox").style.display = "none";
    }

    function extractJSON(raw) {
      const start = raw.indexOf("{");
      const end = raw.lastIndexOf("}");
      if (start === -1 || end === -1 || end <= start) throw new Error("No JSON");
      return JSON.parse(raw.slice(start, end + 1));
    }

    function normalizeSem(rawSem) {
      const s = String(rawSem || "VERDE").toUpperCase();
      if (s.includes("ROJ") || s.includes("RED")) return "ROJO";
      if (s.includes("AMAR") || s.includes("YELL")) return "AMARILLO";
      return "VERDE";
    }

    function computeDelta(eje) {
      if (!eje) return { db: 0, pct: 0 };
      const pol = String(eje.polaridad || "NEUTRO").toUpperCase();
      if (eje.delta_db !== undefined && eje.delta_db !== null && !Number.isNaN(Number(eje.delta_db))) {
        const db = Number(eje.delta_db);
        const pct = db >= 0 ? (Math.pow(10, db / 20) - 1) * 100 : -(Math.pow(10, Math.abs(db) / 20) - 1) * 100;
        return { db, pct };
      }
      const rawPct = Math.abs(Number(eje.delta_pct ?? eje.delta_basal_pct ?? 0)) || 0;
      if (pol.includes("CREC") || pol.includes("GROW") || pol.includes("POS")) {
        return { db: 20 * Math.log10(1 + rawPct / 100), pct: rawPct };
      }
      if (pol.includes("REGR") || pol.includes("NEG")) {
        return { db: -20 * Math.log10(1 + rawPct / 100), pct: -rawPct };
      }
      return { db: 0, pct: 0 };
    }

    function formatDbPct(db, pct) {
      if (Math.abs(db) < 0.005) return "0.00 dB (0%)";
      const sign = db > 0 ? "+" : "";
      const pSign = pct > 0 ? "+" : "";
      return `${sign}${db.toFixed(2)} dB (${pSign}${Math.round(pct)}%)`;
    }

    function renderFromInput() {
      const err = document.getElementById("errBox");
      err.style.display = "none";
      try {
        const data = extractJSON(document.getElementById("jsonInput").value.trim());
        if (!data.evaluacion_ejes) throw new Error("Missing evaluacion_ejes");
        lastParsed = data;
        renderData(data);
      } catch (e) {
        err.textContent = UI[currentLocale].err;
        err.style.display = "block";
      }
    }

    function renderData(data) {
      const t = UI[currentLocale];
      const ed = data.estado_educabilidad || {};
      const semKey = normalizeSem(ed.semaforo);
      const box = document.getElementById("semaforoBox");
      const title = document.getElementById("semaforoTitle");
      const color = semKey === "ROJO" ? "var(--delta-red)" : (semKey === "AMARILLO" ? "var(--delta-yellow)" : "var(--delta-green)");
      box.style.borderLeftColor = color;
      title.style.color = color;
      title.textContent = t.sem[semKey];
      document.getElementById("semaforoAnalisis").textContent = ed.analisis_previo_educabilidad || "";
      document.getElementById("semaforoAdv").textContent = ed.advertencia_pedagogica || "";

      const ej = data.evaluacion_ejes || {};
      const rows = AXES.map(a => {
        const item = ej[a.key] || {};
        const calc = computeDelta(item);
        return {
          short: currentLocale === "es" ? a.short_es : a.short_en,
          full: currentLocale === "es" ? a.full_es : a.full_en,
          reason: item.razonamiento || "—",
          ...calc
        };
      });

      const tbody = document.getElementById("axesBody");
      tbody.innerHTML = "";
      rows.forEach(r => {
        const cls = r.db > 0.005 ? "delta-pos" : (r.db < -0.005 ? "delta-neg" : "delta-neu");
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td><span class="axis-name">${r.full}</span><span class="delta-val ${cls}">${formatDbPct(r.db, r.pct)}</span></td>` +
          `<td class="reason-txt">${r.reason}</td>`;
        tbody.appendChild(tr);
      });

      drawRadar(rows);
      document.getElementById("resultSection").style.display = "block";
      collapseInputCard();
    }

    function drawRadar(rows) {
      const svg = document.getElementById("radarSvg");
      const cx = 230, cy = 156, r = 92, n = rows.length;
      const maxAbs = Math.max(...rows.map(x => Math.abs(x.db)), 0);
      const maxRange = maxAbs > 6.0 ? 12.0 : (maxAbs > 3.0 ? 6.0 : 3.0);
      const step = maxRange / 2;

      let out = `<text x="14" y="18" fill="var(--text-dim)" font-size="8.5" font-family="monospace">${UI[currentLocale].scale}: ±${maxRange.toFixed(1)} dB</text>`;

      for (let db = -maxRange + step; db <= maxRange + 0.001; db += step) {
        const f = (db + maxRange) / (2 * maxRange);
        const isBase = Math.abs(db) < 0.01;
        const isOuter = Math.abs(db - maxRange) < 0.01;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const ang = (Math.PI * 2 / n) * i - Math.PI / 2;
          pts.push(`${cx + Math.cos(ang) * r * f},${cy + Math.sin(ang) * r * f}`);
        }
        if (isBase) {
          out += `<polygon points="${pts.join(" ")}" fill="none" stroke="#4f46e5" stroke-width="1.9"/>`;
        } else if (isOuter) {
          out += `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--radar-grid)" stroke-width="1.3"/>`;
        } else {
          out += `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--radar-grid)" stroke-width="0.95" stroke-dasharray="3,3"/>`;
        }
        if (db >= -0.01) {
          const da = -Math.PI / 2 + Math.PI / 8;
          out += `<text x="${cx + Math.cos(da)*r*f + 2}" y="${cy + Math.sin(da)*r*f - 1}" fill="${isBase ? "#6366f1" : "var(--text-dim)"}" font-size="7.5" font-family="monospace">${isBase ? "0.0" : "+" + db.toFixed(1)}</text>`;
        }
      }

      for (let i = 0; i < n; i++) {
        const ang = (Math.PI * 2 / n) * i - Math.PI / 2;
        out += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(ang)*r}" y2="${cy + Math.sin(ang)*r}" stroke="var(--radar-grid)" stroke-width="1"/>`;
        const lx = cx + Math.cos(ang) * (r + 18);
        const ly = cy + Math.sin(ang) * (r + 13);
        const anchor = Math.cos(ang) > 0.3 ? "start" : (Math.cos(ang) < -0.3 ? "end" : "middle");
        out += `<text x="${lx}" y="${ly}" fill="var(--text-muted)" font-size="9" text-anchor="${anchor}" alignment-baseline="middle">${rows[i].short}</text>`;
      }

      const activePts = rows.map((row, i) => {
        const ang = (Math.PI * 2 / n) * i - Math.PI / 2;
        const norm = Math.max(0.04, Math.min(1.0, (row.db + maxRange) / (2 * maxRange)));
        return `${cx + Math.cos(ang) * r * norm},${cy + Math.sin(ang) * r * norm}`;
      });
      out += `<polygon points="${activePts.join(" ")}" fill="rgba(168, 85, 247, 0.22)" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="4,3"/>`;
      activePts.forEach(p => {
        const [x, y] = p.split(",");
        out += `<circle cx="${x}" cy="${y}" r="3.5" fill="#a855f7"/>`;
      });
      svg.innerHTML = out;
    }

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./visor-sw.js").then(() => {
        swReady = true;
        document.getElementById("offlinePill").textContent = UI[currentLocale].offlineCached;
      }).catch(() => {});
    }


    function collapseInputCard() {
      const card = document.getElementById("inputCard");
      if (card) card.classList.add("collapsed-input");
    }

    function expandInputCard() {
      const card = document.getElementById("inputCard");
      if (card) card.classList.remove("collapsed-input");
    }

    function openShareModal() {
      const modal = document.getElementById("shareModal");
      const nativeBtn = document.getElementById("btnNativeShare");
      if (nativeBtn) nativeBtn.style.display = navigator.share ? "block" : "none";
      document.getElementById("btnCopyUrl").textContent = UI[currentLocale].btnCopyUrl;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeShareModal() {
      const modal = document.getElementById("shareModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    async function triggerNativeShare() {
      if (!navigator.share) return;
      try {
        await navigator.share({
          title: "PRISMA™ Visor — Aula Viva®",
          text: UI[currentLocale].shareText,
          url: VISOR_SHARE_URL
        });
      } catch (e) {}
    }

    async function copyVisorUrl() {
      const btn = document.getElementById("btnCopyUrl");
      try {
        await navigator.clipboard.writeText(VISOR_SHARE_URL);
      } catch (e) {
        const tmp = document.createElement("textarea");
        tmp.value = VISOR_SHARE_URL;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        document.body.removeChild(tmp);
      }
      btn.textContent = UI[currentLocale].copiedUrl;
      setTimeout(() => { btn.textContent = UI[currentLocale].btnCopyUrl; }, 1800);
    }

    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeShareModal();
    });

    setLocale("es");
  </script>
